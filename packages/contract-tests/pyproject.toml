[project]
name = "factory-contract-tests"
version = "0.1.0"
description = "Shared conformance suites for factory module interfaces."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "factory-core", "factory-fakes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_contract_tests"]
