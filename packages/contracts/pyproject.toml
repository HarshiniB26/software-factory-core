[project]
name = "factory-contracts"
version = "0.1.0"
description = "Protocols and Pydantic schemas for the software factory."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_contracts"]
