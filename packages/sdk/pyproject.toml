[project]
name = "factory-sdk"
version = "0.1.0"
description = "Typed Python client for the factory HTTP API."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_sdk"]
