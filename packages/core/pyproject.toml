[project]
name = "factory-core"
version = "0.1.0"
description = "Vendor-free factory core: event log, registry, policy, config, module loader."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "factory-contracts",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_core"]

[project.scripts]
factory-migrate = "factory_core.migrate:main"
