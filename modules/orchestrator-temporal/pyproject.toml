[project]
name = "factory-orchestrator-temporal"
version = "0.1.0"
description = "Temporal OSS orchestrator module."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "temporalio>=1.9"]

[project.entry-points."factory.modules"]
orchestrator-temporal = "factory_orchestrator_temporal:TemporalOrchestrator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_orchestrator_temporal"]
