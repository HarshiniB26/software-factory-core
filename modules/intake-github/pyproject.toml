[project]
name = "factory-intake-github"
version = "0.1.0"
description = "Optional GitHub issue intake. Label factory creates a request."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.entry-points."factory.modules"]
intake-github-issues = "factory_intake_github:GitHubIssueIntake"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_intake_github"]
