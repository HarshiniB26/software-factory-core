[project]
name = "factory-skills-git"
version = "0.1.0"
description = "Pinned, scanned skills. License allowlist MIT, Apache-2.0, BSD."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "pyyaml>=6"]

[project.entry-points."factory.modules"]
skills-git = "factory_skills_git:GitSkillSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_skills_git"]
