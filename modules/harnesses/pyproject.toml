[project]
name = "factory-harnesses"
version = "0.1.0"
description = "Claude Code and Codex harness adapters."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.optional-dependencies]
claude = ["claude-agent-sdk"]
codex = ["openai-codex"]

[project.entry-points."factory.modules"]
harness-claude-code = "factory_harnesses.claude:ClaudeHarness"
harness-codex = "factory_harnesses.codex:CodexHarness"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_harnesses"]
