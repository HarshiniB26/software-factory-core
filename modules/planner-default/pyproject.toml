[project]
name = "factory-planner-default"
version = "0.1.0"
description = "Planner that emits a task DAG with touch sets."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.entry-points."factory.modules"]
planner-default = "factory_planner_default:DefaultPlanner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_planner_default"]
