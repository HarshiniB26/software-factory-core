[project]
name = "factory-eval-replay"
version = "0.1.0"
description = "Held-out eval runner and version comparison."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "pyyaml>=6"]

[project.entry-points."factory.modules"]
eval-replay = "factory_eval_replay:ReplayEval"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_eval_replay"]
