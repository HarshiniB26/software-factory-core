[project]
name = "factory-obs-otel"
version = "0.1.0"
description = "Stdout OpenTelemetry-style exporter."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.entry-points."factory.modules"]
obs-otel = "factory_obs_otel:OtelExporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_obs_otel"]
