[project]
name = "factory-gates"
version = "0.1.0"
description = "Quality gates: tests, gitleaks, semgrep, trivy, OSV, and cross-vendor review."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "factory-sandboxes"]

[project.entry-points."factory.modules"]
gate-tests = "factory_gates.gate_tests:TestsGate"
gate-gitleaks = "factory_gates.gate_gitleaks:GitleaksGate"
gate-semgrep = "factory_gates.gate_semgrep:SemgrepGate"
gate-trivy = "factory_gates.gate_trivy:TrivyGate"
gate-osv = "factory_gates.gate_osv:OsvGate"
gate-review = "factory_gates.gate_review:ReviewGate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_gates"]
