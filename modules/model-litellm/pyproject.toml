[project]
name = "factory-model-litellm"
version = "0.1.0"
description = "LiteLLM-compatible model router with hard budget caps."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "httpx>=0.28"]

[project.optional-dependencies]
embedded = ["litellm"]

[project.entry-points."factory.modules"]
model-litellm = "factory_model_litellm:LiteLLMModel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_model_litellm"]
