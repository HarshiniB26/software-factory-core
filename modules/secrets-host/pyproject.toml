[project]
name = "factory-secrets-host"
version = "0.1.0"
description = "Host-held secrets. Short-lived tokens never enter a sandbox."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.entry-points."factory.modules"]
secrets-host = "factory_secrets_host:HostSecrets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_secrets_host"]
