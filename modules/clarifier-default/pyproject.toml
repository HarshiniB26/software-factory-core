[project]
name = "factory-clarifier-default"
version = "0.1.0"
description = "Deterministic clarifier. At most three questions, then assumptions."
requires-python = ">=3.12"
dependencies = ["factory-contracts"]

[project.entry-points."factory.modules"]
clarifier-default = "factory_clarifier_default:DefaultClarifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_clarifier_default"]
