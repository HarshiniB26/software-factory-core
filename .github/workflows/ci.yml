name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FACTORY_DATABASE_URL: postgresql+asyncpg://factory:factory@localhost:5432/factory
      FACTORY_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked .env files are not allowed:"
            echo "$tracked"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run alembic -c packages/core/alembic.ini upgrade head
      - run: uv run pytest
