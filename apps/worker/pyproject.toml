[project]
name = "factory-worker"
version = "0.1.0"
description = "Temporal worker. Week 1 registers one no-op request workflow."
requires-python = ">=3.12"
dependencies = ["factory-contracts", "factory-core", "factory-pipeline", "temporalio>=1.9"]

[project.scripts]
factory-worker = "factory_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_worker"]
