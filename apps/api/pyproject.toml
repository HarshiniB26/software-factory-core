[project]
name = "factory-api"
version = "0.1.0"
description = "FastAPI public API: health, requests, and the SSE event stream."
requires-python = ">=3.12"
dependencies = [
    "factory-contracts",
    "factory-core",
    "factory-pipeline",
    "authlib>=1.3",
    "cryptography>=43",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
]

[project.scripts]
factory-api = "factory_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_api"]
