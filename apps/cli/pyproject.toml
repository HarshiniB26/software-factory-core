[project]
name = "factory-cli"
version = "0.1.0"
description = "Factory CLI. Calls the HTTP API and nothing else."
requires-python = ">=3.12"
dependencies = ["factory-sdk", "typer>=0.12"]

[project.scripts]
factory = "factory_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_cli"]
